<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test</title>
</head>
<body>
    <h1>Simple Test for formFieldMapping</h1>
    <button id="runTest">Run Simple Test</button>
    <div id="results"></div>

    <script type="module">
        import { result } from './src/api/simple_test.ts';
        
        document.getElementById('runTest').addEventListener('click', () => {
            document.getElementById('results').innerHTML = `
                <h2>Test Results:</h2>
                <pre>${JSON.stringify(result, null, 2)}</pre>
            `;
        });
    </script>
</body>
</html>
